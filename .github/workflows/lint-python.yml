name: Lint Python

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/flask/**'
      - 'apps/microservices/**'
      - 'libs/python/**'
      - 'ruff.toml'
      - '.python-version'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/lint-python.yml'
      - '.github/scripts/verify-workspace-membership.sh'
  push:
    branches: [main]
    paths:
      - 'apps/flask/**'
      - 'apps/microservices/**'
      - 'libs/python/**'
      - 'ruff.toml'
      - '.python-version'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/lint-python.yml'
      - '.github/scripts/verify-workspace-membership.sh'
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      # Python has no per-package dependency install here (linting doesn't need the code to
      # import — see D3). Node/pnpm/turbo are still required, purely so the workspace
      # membership check below can run turbo's dry-run task graph, exactly like the
      # JavaScript workflow does; this is not a copy-paste accident.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies (for turbo dry-run only)
        run: pnpm install --frozen-lockfile

      - name: Install ruff
        run: pip install ruff==0.16.2

      - name: Verify workspace membership
        run: |
          chmod +x .github/scripts/verify-workspace-membership.sh
          .github/scripts/verify-workspace-membership.sh apps/flask apps/microservices libs/python

      - name: Run ruff check
        run: ruff check apps/flask apps/microservices libs/python

      - name: Run ruff format check
        run: ruff format --check apps/flask apps/microservices libs/python
