name: Lint Go

on:
  pull_request:
    branches: [main]
    paths:
      - 'libs/golang/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/lint-go.yml'
  push:
    branches: [main]
    paths:
      - 'libs/golang/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/lint-go.yml'
  workflow_dispatch:

jobs:
  lint-go:
    name: Lint Go (go vet + gofmt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.work'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...
