[project]
name = "web-crawlers"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
  "requests",
  "beautifulsoup4",
  "selenium",
  "webdriver-manager",
  "google-speech",
  "retrying",
  "lxml",
  "html5lib",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_crawlers"]
