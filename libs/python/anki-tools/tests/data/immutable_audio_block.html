<!-- The Audio field holds bare filenames, never Anki sound tags:
     Anki autoplays every sound tag in a rendered field, in order, before
     any template JS runs, so tags would play all four recordings back to
     back with no way to pick one. This script picks one and renders a
     <button> so the native replay key still has something to replay.

     `afmt` re-embeds the question's rendered HTML via `{{FrontSide}}`,
     re-running this script on the answer side of a card whose audio sits
     on the question side. That echo must neither re-roll the voice nor
     play it twice, while a block living only on the answer side must play
     on that render. Position relative to `#back` is what tells them
     apart: the echo is outside it, an answer-side block is inside it, and
     on the question side `#back` does not exist yet -- hence the deferral
     by one macrotask, since at parse time neither element is in the page
     yet. The stored voice must also be one of THIS note's own files, so a
     global left by another note can never silence a render. -->
<div id="audio"><span id="audio-data" class="hidden">{{Audio}}</span>
<span id="audio-controls"></span></div>
<script>
(function () {
  var data = document.getElementById("audio-data");
  if (!data) return;
  var text = data.textContent.trim();
  if (!text) return;
  var files = text
    .split(/[,\n]+/)
    .map(function (f) { return f.trim(); })
    .filter(function (f) { return f.length > 0; });
  if (files.length === 0) return;
  setTimeout(function () {
    var container = document.getElementById("audio");
    if (!container || container.querySelector("audio")) return;
    var back = document.getElementById("back");
    var stored = window.__immutableWordsAudioChoice;
    var echo =
      !!back && !back.contains(container) && files.indexOf(stored) !== -1;
    var chosen = echo
      ? stored
      : files[Math.floor(Math.random() * files.length)];
    window.__immutableWordsAudioChoice = chosen;
    var audio = document.createElement("audio");
    audio.autoplay = !echo;
    audio.src = chosen;
    var button = document.createElement("button");
    button.className = "audio-play";
    button.textContent = "▶";
    button.addEventListener("click", function () {
      audio.currentTime = 0;
      audio.play();
    });
    container.appendChild(audio);
    container.appendChild(button);
  }, 0);
})();
</script>
